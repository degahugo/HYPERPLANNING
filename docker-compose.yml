services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hyperplanning
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d hyperplanning"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  hyperplanning:
    build: .
    container_name: hyperplanning-java21
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: